<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACK MASTER - Tactical Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Chakra+Petch:wght@500;700&display=swap');
        body { font-family: 'Kanit', sans-serif; }
        .logic-font { font-family: 'Chakra Petch', sans-serif; }
        .page-active { display: flex; animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        select { -webkit-appearance: none; appearance: none; cursor: pointer; }
        .loader { border-top-color: #2563eb; animation: spinner 0.6s linear infinite; }
        @keyframes spinner { to { transform: rotate(360deg); } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- 1. Start Page -->
    <section id="page-start" class="page-active min-h-screen flex-col items-center justify-center p-6 text-center">
        <div class="w-24 h-24 bg-blue-600 rounded-[2rem] flex items-center justify-center shadow-2xl shadow-blue-200 mb-8">
            <i data-lucide="crosshair" class="w-12 h-12 text-white"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-slate-900 mb-3 tracking-tight uppercase italic logic-font">Sack Master</h1>
        <p class="text-slate-500 text-sm max-w-xs mb-10 leading-relaxed">
            Intelligence Inventory Control<br>วิเคราะห์สต็อกผืนผ้าและรายการตัดใช้แบบ Real-time
        </p>
        <button onclick="navigate('menu')" class="w-full max-w-xs bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-100 hover:bg-blue-700 active:scale-95 transition-all flex items-center justify-center gap-2">
            <span>เข้าสู่หน้าปฏิบัติการ</span>
            <i data-lucide="play" class="w-5 h-5 fill-current"></i>
        </button>
    </section>

    <!-- 2. Menu Page -->
    <section id="page-menu" class="hidden min-h-screen flex-col p-6">
        <div class="mb-8 border-b border-slate-100 pb-4 flex justify-between items-end">
            <div>
                <h2 class="text-2xl font-bold text-slate-900 logic-font italic uppercase">Command Center</h2>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Target Selection</p>
            </div>
            <div id="sync-status" class="text-[9px] font-bold text-emerald-500 flex items-center gap-1 mb-1">
                <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> SYSTEM ONLINE
            </div>
        </div>

        <div class="grid grid-cols-1 gap-4">
            <button onclick="navigate('fabric-check')" class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center gap-5 active:scale-95 transition-all text-left group">
                <div class="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-600 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                    <i data-lucide="search"></i>
                </div>
                <div>
                    <h3 class="font-bold text-slate-800 uppercase tracking-tight">เช็คม้วนผืนผ้า (Tactical)</h3>
                    <p class="text-[11px] text-slate-400">ระบุสเปกเพื่อดูรายการตัดใช้บรรทัดต่อบรรทัด</p>
                </div>
            </button>
        </div>
        
        <button onclick="navigate('start')" class="mt-auto py-4 text-slate-400 text-[10px] font-bold uppercase tracking-widest flex items-center justify-center gap-2">
            <i data-lucide="log-out" class="w-3 h-3"></i> Back to Start
        </button>
    </section>

    <!-- 3. Fabric Check Page -->
    <section id="page-fabric-check" class="hidden min-h-screen flex-col pb-12">
        <header class="bg-white p-6 border-b sticky top-0 z-30 shadow-sm">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <button onclick="navigate('menu')" class="p-2 text-slate-400 hover:text-blue-600"><i data-lucide="chevron-left"></i></button>
                    <h2 class="text-lg font-bold tracking-tight">ระบบวิเคราะห์สเปก</h2>
                </div>
                <button onclick="refreshData()" class="p-2 text-slate-300 hover:text-blue-500 transition-colors"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
            </div>

            <!-- Dynamic Filter Grid -->
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-slate-400 uppercase ml-1">หน้ากว้าง</label>
                    <div class="relative">
                        <select id="sel-width" onchange="updateFilters('หน้ากว้าง')" class="w-full bg-slate-50 border-none rounded-xl py-2.5 px-3 text-xs font-bold focus:ring-2 focus:ring-blue-500"></select>
                        <i data-lucide="chevron-down" class="absolute right-2 top-1/2 -translate-y-1/2 w-3 h-3 text-slate-300 pointer-events-none"></i>
                    </div>
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-slate-400 uppercase ml-1">Denier</label>
                    <div class="relative">
                        <select id="sel-denia" onchange="updateFilters('Average of Denia')" class="w-full bg-slate-50 border-none rounded-xl py-2.5 px-3 text-xs font-bold focus:ring-2 focus:ring-blue-500"></select>
                        <i data-lucide="chevron-down" class="absolute right-2 top-1/2 -translate-y-1/2 w-3 h-3 text-slate-300 pointer-events-none"></i>
                    </div>
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-slate-400 uppercase ml-1">Pattern</label>
                    <div class="relative">
                        <select id="sel-pattern" onchange="updateFilters('Pattern')" class="w-full bg-slate-50 border-none rounded-xl py-2.5 px-3 text-xs font-bold focus:ring-2 focus:ring-blue-500"></select>
                        <i data-lucide="chevron-down" class="absolute right-2 top-1/2 -translate-y-1/2 w-3 h-3 text-slate-300 pointer-events-none"></i>
                    </div>
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-slate-400 uppercase ml-1">Frequency</label>
                    <div class="relative">
                        <select id="sel-frequency" onchange="updateFilters('Frequency')" class="w-full bg-slate-50 border-none rounded-xl py-2.5 px-3 text-xs font-bold focus:ring-2 focus:ring-blue-500"></select>
                        <i data-lucide="chevron-down" class="absolute right-2 top-1/2 -translate-y-1/2 w-3 h-3 text-slate-300 pointer-events-none"></i>
                    </div>
                </div>
                <div class="col-span-2 space-y-1">
                    <label class="text-[9px] font-black text-slate-400 uppercase ml-1">สี</label>
                    <div class="relative">
                        <select id="sel-color" onchange="updateFilters('Color')" class="w-full bg-slate-50 border-none rounded-xl py-2.5 px-3 text-xs font-bold focus:ring-2 focus:ring-blue-500"></select>
                        <i data-lucide="palette" class="absolute right-2 top-1/2 -translate-y-1/2 w-3 h-3 text-slate-300 pointer-events-none"></i>
                    </div>
                </div>
            </div>
            
            <div class="flex gap-2 mt-4">
                <button onclick="resetAllFilters()" class="flex-1 py-3 bg-slate-100 text-slate-500 rounded-xl text-[10px] font-bold uppercase tracking-widest hover:bg-slate-200 transition-all">Reset</button>
                <button onclick="realSearch()" class="flex-[2] py-3 bg-blue-600 text-white rounded-xl text-[10px] font-bold uppercase tracking-widest shadow-lg shadow-blue-100 active:scale-95 transition-all">Analyze Target</button>
            </div>
        </header>

        <!-- Result Ledger View -->
        <main class="p-4">
            <div id="loading-results" class="hidden flex-col items-center py-10">
                <div class="loader ease-linear rounded-full border-2 border-t-2 border-gray-200 h-8 w-8 mb-4"></div>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Computing Data...</p>
            </div>

            <div id="result-area" class="hidden space-y-4 animate-in fade-in duration-300">
                <!-- Summary Header -->
                <div id="result-summary" class="bg-slate-900 rounded-3xl p-5 text-white shadow-xl">
                    <!-- Dynamic Header Content -->
                </div>

                <!-- Ledger Table -->
                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="bg-slate-50 px-4 py-2 border-b flex justify-between items-center">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Tactical Ledger</span>
                        <span id="row-count" class="text-[9px] bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full font-bold">0 Rows</span>
                    </div>
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="text-[9px] font-black text-slate-400 uppercase tracking-tighter border-b bg-slate-50/50">
                                    <th class="px-4 py-3">Sales / Item</th>
                                    <th class="px-2 py-3">Plant</th>
                                    <th class="px-2 py-3">Machine</th>
                                    <th class="px-2 py-3 text-right">Running</th>
                                    <th class="px-4 py-3 text-right">Stock</th>
                                </tr>
                            </thead>
                            <tbody id="ledger-body" class="text-[11px] font-medium text-slate-600">
                                <!-- Table rows injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </section>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQhA5Pgw2DjeL_JLpWHruLvV9bMs5Wk2IFU-FA1C5AFUFWkql48YxoS8fVb1ueuaeeG_PwIrFtTjyhi/pub?output=csv';
        let rawData = [];
        const filterFields = ['หน้ากว้าง', 'Average of Denia', 'Pattern', 'Frequency', 'Color'];

        async function refreshData() {
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                complete: (results) => {
                    rawData = results.data;
                    updateFilters(); // First load
                    console.log("Tactical Data Synced:", rawData.length);
                }
            });
        }

        // --- Logic: Dynamic Dropdowns ---
        function updateFilters(changedField) {
            // Get current values
            const selections = {};
            filterFields.forEach(f => {
                selections[f] = document.getElementById(getFieldId(f)).value;
            });

            // Re-populate all dropdowns based on other selections
            filterFields.forEach(field => {
                const sel = document.getElementById(getFieldId(field));
                const currentVal = sel.value;

                // Create a subset of data filtered by ALL selections EXCEPT the current field
                const filteredSubset = rawData.filter(item => {
                    return filterFields.every(f => {
                        if (f === field || selections[f] === "" || selections[f] === "ทั้งหมด") return true;
                        return String(item[f]) === selections[f];
                    });
                });

                // Get unique values for this field from the subset
                const uniqueValues = [...new Set(filteredSubset.map(item => String(item[field] || '').trim()))]
                    .filter(v => v !== '')
                    .sort();

                // Keep "ทั้งหมด" as first option
                sel.innerHTML = `<option value="ทั้งหมด">-- ทั้งหมด --</option>` + 
                    uniqueValues.map(v => `<option value="${v}" ${v === currentVal ? 'selected' : ''}>${v}</option>`).join('');
            });
            
            lucide.createIcons();
        }

        function getFieldId(field) {
            const map = {
                'หน้ากว้าง': 'sel-width',
                'Average of Denia': 'sel-denia',
                'Pattern': 'sel-pattern',
                'Frequency': 'sel-frequency',
                'Color': 'sel-color'
            };
            return map[field];
        }

        function resetAllFilters() {
            filterFields.forEach(f => document.getElementById(getFieldId(f)).value = "ทั้งหมด");
            updateFilters();
        }

        // --- Logic: Search & Render ---
        function realSearch() {
            const selections = {};
            filterFields.forEach(f => selections[f] = document.getElementById(getFieldId(f)).value);

            document.getElementById('loading-results').classList.remove('hidden');
            document.getElementById('result-area').classList.add('hidden');

            setTimeout(() => {
                const results = rawData.filter(item => {
                    return filterFields.every(f => {
                        if (selections[f] === "ทั้งหมด" || !selections[f]) return true;
                        return String(item[f]) === selections[f];
                    });
                });

                renderLedger(results, selections);
                
                document.getElementById('loading-results').classList.add('hidden');
                document.getElementById('result-area').classList.remove('hidden');
                
                window.scrollTo({ top: document.getElementById('result-area').offsetTop - 20, behavior: 'smooth' });
            }, 400);
        }

        function renderLedger(items, spec) {
            const body = document.getElementById('ledger-body');
            const summary = document.getElementById('result-summary');
            document.getElementById('row-count').textContent = `${items.length} รายการ`;

            if (items.length === 0) {
                summary.innerHTML = `<p class="text-center py-4 opacity-50">ไม่พบเป้าหมายในระบบ</p>`;
                body.innerHTML = `<tr><td colspan="5" class="py-20 text-center text-slate-300 uppercase tracking-widest font-black">Target Lost</td></tr>`;
                return;
            }

            // Calculate totals
            const totalStock = items.reduce((sum, i) => sum + (parseFloat(i['Stock คงเหลือ']) || 0), 0);
            const totalRunning = items.reduce((sum, i) => sum + (parseFloat(i['Qty Back Ordered']) || 0), 0);

            summary.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="text-blue-400 font-black logic-font uppercase text-xs tracking-widest mb-1 italic">Tactical Specs</h2>
                        <p class="text-lg font-bold leading-tight uppercase">${spec['หน้ากว้าง']}ซม. | ${spec['Pattern']} | ${spec['Color']}</p>
                    </div>
                    <div class="text-right">
                        <span class="text-[9px] bg-blue-500/20 text-blue-400 border border-blue-500/30 px-2 py-1 rounded-md font-bold uppercase tracking-tighter">Mission Active</span>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4 border-t border-white/10 pt-4 mt-2">
                    <div>
                        <span class="text-[9px] text-slate-400 uppercase font-black block tracking-widest">Grand Running</span>
                        <span class="text-2xl font-black italic logic-font text-blue-400">${totalRunning.toLocaleString()} <span class="text-[8px]">PCS</span></span>
                    </div>
                    <div>
                        <span class="text-[9px] text-slate-400 uppercase font-black block tracking-widest">Grand Stock</span>
                        <span class="text-2xl font-black italic logic-font text-white">${totalStock.toLocaleString()} <span class="text-[8px]">PCS</span></span>
                    </div>
                </div>
            `;

            body.innerHTML = items.map((item, idx) => {
                const stock = parseFloat(item['Stock คงเหลือ'] || 0);
                const run = parseFloat(item['Qty Back Ordered'] || 0);
                const isCritical = stock <= 0 && run > 0;

                return `
                    <tr class="border-b border-slate-50 hover:bg-slate-50/80 transition-colors">
                        <td class="px-4 py-4">
                            <div class="flex flex-col">
                                <span class="text-[9px] font-black text-blue-600 font-mono tracking-tighter">${item['Item']}</span>
                                <span class="font-bold text-slate-800 line-clamp-1">${item['ฝ่ายขาย'] || 'N/A'}</span>
                            </div>
                        </td>
                        <td class="px-2 py-4">
                            <span class="text-[10px] bg-slate-100 px-1.5 py-0.5 rounded font-bold">${item['Plant'] || '-'}</span>
                        </td>
                        <td class="px-2 py-4">
                            <div class="flex items-center gap-1">
                                <span class="w-1 h-1 rounded-full ${item['Weaving Machine No.'] ? 'bg-emerald-500 animate-pulse' : 'bg-slate-300'}"></span>
                                <span class="text-[10px] font-bold">${item['Weaving Machine No.'] || '-'}</span>
                            </div>
                        </td>
                        <td class="px-2 py-4 text-right">
                            <span class="font-black ${run > 0 ? 'text-blue-500' : 'text-slate-300'}">${run.toLocaleString()}</span>
                        </td>
                        <td class="px-4 py-4 text-right">
                            <span class="font-black ${stock > 0 ? 'text-slate-900' : 'text-rose-400'}">${stock.toLocaleString()}</span>
                        </td>
                    </tr>
                `;
            }).join('');
            
            lucide.createIcons();
        }

        function navigate(pageId) {
            const pages = ['start', 'menu', 'fabric-check'];
            pages.forEach(id => document.getElementById(`page-${id}`).classList.replace('page-active', 'hidden'));
            document.getElementById(`page-${pageId}`).classList.replace('hidden', 'page-active');
            if (pageId === 'menu' && rawData.length === 0) refreshData();
            lucide.createIcons();
            window.scrollTo(0, 0);
        }

        window.onload = () => lucide.createIcons();
    </script>
</body>
</html>
