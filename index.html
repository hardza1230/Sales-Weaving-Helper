<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACK MASTER - Real-time Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
        body { font-family: 'Kanit', sans-serif; }
        .page-active { display: flex; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        .loader { border-top-color: #2563eb; animation: spinner 0.6s linear infinite; }
        @keyframes spinner { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- 1. Start Page (หน้าแนะนำ) -->
    <section id="page-start" class="page-active min-h-screen flex-col items-center justify-center p-6 text-center">
        <div class="w-24 h-24 bg-blue-600 rounded-[2rem] flex items-center justify-center shadow-2xl shadow-blue-200 mb-8">
            <i data-lucide="shield-check" class="w-12 h-12 text-white"></i>
        </div>
        <h1 class="text-3xl font-extrabold text-slate-900 mb-3 tracking-tight uppercase">Sack Master</h1>
        <p class="text-slate-500 text-sm max-w-xs mb-10 leading-relaxed">
            ระบบบริหารจัดการคลังสินค้าอัจฉริยะ<br>ตรวจสอบสถานะผืนผ้าและสต็อกแบบ Real-time
        </p>
        <button onclick="navigate('menu')" class="w-full max-w-xs bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-100 hover:bg-blue-700 active:scale-95 transition-all flex items-center justify-center gap-2">
            <span>เข้าสู่ระบบข้อมูลจริง</span>
            <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </button>
        <p class="mt-20 text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em]">Operational Console v3.0 (Sync Data)</p>
    </section>

    <!-- 2. Menu Page (หน้าเลือกโหมด) -->
    <section id="page-menu" class="hidden min-h-screen flex-col p-6">
        <div class="mb-8 border-b border-slate-100 pb-4 flex justify-between items-end">
            <div>
                <h2 class="text-2xl font-bold text-slate-900 font-mono italic uppercase">OPERATIONS</h2>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Select mission objective</p>
            </div>
            <div id="sync-status" class="text-[9px] font-bold text-emerald-500 flex items-center gap-1 mb-1">
                <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> SYNCED
            </div>
        </div>

        <div class="grid grid-cols-1 gap-4">
            <button onclick="navigate('fabric-check')" class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center gap-5 active:scale-95 transition-all text-left group">
                <div class="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-600 group-hover:bg-blue-600 group-hover:text-white transition-colors shadow-inner">
                    <i data-lucide="scroll-text"></i>
                </div>
                <div>
                    <h3 class="font-bold text-slate-800 uppercase tracking-tight">เช็คม้วนผืนผ้า</h3>
                    <p class="text-[11px] text-slate-400">ค้นหาตามสเปก: หน้ากว้าง, Denier, ความถี่, สี</p>
                </div>
            </button>

            <button class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center gap-5 opacity-40 cursor-not-allowed">
                <div class="w-14 h-14 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-400">
                    <i data-lucide="package"></i>
                </div>
                <div>
                    <h3 class="font-bold text-slate-800">สต็อกกระสอบสำเร็จรูป</h3>
                    <p class="text-[11px] text-slate-400">ระบบอยู่ระหว่างการพัฒนา</p>
                </div>
            </button>
        </div>
        
        <button onclick="navigate('start')" class="mt-auto py-4 text-slate-400 text-[10px] font-bold uppercase tracking-widest flex items-center justify-center gap-2">
            <i data-lucide="log-out" class="w-3 h-3"></i> Exit System
        </button>
    </section>

    <!-- 3. Fabric Check Page (หน้าทำงานจริง) -->
    <section id="page-fabric-check" class="hidden min-h-screen flex-col p-6 pb-12">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <button onclick="navigate('menu')" class="p-2 text-slate-400 hover:text-blue-600 transition-colors"><i data-lucide="arrow-left"></i></button>
                <h2 class="text-lg font-bold tracking-tight">ระบบระบุสเปกผืนผ้า</h2>
            </div>
            <button onclick="refreshData()" class="p-2 text-slate-400 hover:rotate-180 transition-transform duration-500"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
        </div>

        <!-- Selection Grid -->
        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 mb-6 space-y-5">
            <div class="grid grid-cols-2 gap-4">
                <!-- Width -->
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase mb-1.5 block px-1">หน้ากว้าง (ซม.)</label>
                    <div class="relative">
                        <select id="sel-width" class="w-full bg-slate-50 border border-slate-100 rounded-xl py-3 px-4 text-xs font-bold outline-none focus:ring-2 focus:ring-blue-500 appearance-none"></select>
                        <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-3 h-3 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>
                <!-- Denier -->
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase mb-1.5 block px-1">Denier</label>
                    <div class="relative">
                        <select id="sel-denia" class="w-full bg-slate-50 border border-slate-100 rounded-xl py-3 px-4 text-xs font-bold outline-none focus:ring-2 focus:ring-blue-500 appearance-none"></select>
                        <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-3 h-3 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>
                <!-- Pattern -->
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase mb-1.5 block px-1">รูปแบบทอ</label>
                    <div class="relative">
                        <select id="sel-pattern" class="w-full bg-slate-50 border border-slate-100 rounded-xl py-3 px-4 text-xs font-bold outline-none focus:ring-2 focus:ring-blue-500 appearance-none"></select>
                        <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-3 h-3 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>
                <!-- Frequency -->
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase mb-1.5 block px-1">ความถี่</label>
                    <div class="relative">
                        <select id="sel-frequency" class="w-full bg-slate-50 border border-slate-100 rounded-xl py-3 px-4 text-xs font-bold outline-none focus:ring-2 focus:ring-blue-500 appearance-none"></select>
                        <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-3 h-3 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>
                <!-- Color -->
                <div class="col-span-2">
                    <label class="text-[10px] font-bold text-slate-400 uppercase mb-1.5 block px-1">สี</label>
                    <div class="relative">
                        <select id="sel-color" class="w-full bg-slate-50 border border-slate-100 rounded-xl py-3 px-4 text-xs font-bold outline-none focus:ring-2 focus:ring-blue-500 appearance-none"></select>
                        <i data-lucide="palette" class="absolute right-3 top-1/2 -translate-y-1/2 w-3 h-3 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>
            </div>
            <button onclick="realSearch()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-100 hover:bg-blue-700 active:scale-95 transition-all flex items-center justify-center gap-2">
                <i data-lucide="zap" class="w-4 h-4 fill-current"></i> วิเคราะห์สถานะข้อมูลจริง
            </button>
        </div>

        <!-- Result Area -->
        <div id="loading-results" class="hidden flex-col items-center py-10">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-10 w-10 mb-4"></div>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Scanning Database...</p>
        </div>

        <div id="result-area" class="hidden space-y-4 animate-in fade-in duration-500 pb-10">
            <div id="result-content" class="space-y-4">
                <!-- Result cards will be injected here -->
            </div>
        </div>
    </section>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQhA5Pgw2DjeL_JLpWHruLvV9bMs5Wk2IFU-FA1C5AFUFWkql48YxoS8fVb1ueuaeeG_PwIrFtTjyhi/pub?output=csv';
        let rawData = [];

        async function refreshData() {
            document.getElementById('sync-status').innerHTML = '<span class="w-1.5 h-1.5 bg-blue-500 rounded-full animate-ping"></span> SYNCING...';
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                complete: (results) => {
                    rawData = results.data;
                    populateDropdowns();
                    document.getElementById('sync-status').innerHTML = '<span class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></span> SYNCED';
                    console.log("Data synced:", rawData.length, "rows");
                }
            });
        }

        function populateDropdowns() {
            const getUnique = (field) => [...new Set(rawData.map(item => item[field]).filter(val => val && val.trim() !== ''))].sort();
            
            const fill = (id, field) => {
                const sel = document.getElementById(id);
                const values = getUnique(field);
                sel.innerHTML = values.map(v => `<option value="${v}">${v}</option>`).join('');
            };

            fill('sel-width', 'หน้ากว้าง');
            fill('sel-denia', 'Average of Denia');
            fill('sel-pattern', 'Pattern');
            fill('sel-frequency', 'Frequency');
            fill('sel-color', 'Color');
        }

        function navigate(pageId) {
            const pages = ['start', 'menu', 'fabric-check'];
            pages.forEach(id => {
                document.getElementById(`page-${id}`).classList.add('hidden');
                document.getElementById(`page-${id}`).classList.remove('page-active');
            });
            
            const activePage = document.getElementById(`page-${pageId}`);
            activePage.classList.remove('hidden');
            activePage.classList.add('page-active');
            
            if (pageId === 'menu' && rawData.length === 0) refreshData();
            
            lucide.createIcons();
            window.scrollTo(0, 0);
        }

        function realSearch() {
            const width = document.getElementById('sel-width').value;
            const denia = document.getElementById('sel-denia').value;
            const pattern = document.getElementById('sel-pattern').value;
            const freq = document.getElementById('sel-frequency').value;
            const color = document.getElementById('sel-color').value;

            document.getElementById('loading-results').classList.remove('hidden');
            document.getElementById('result-area').classList.add('hidden');

            // Simulate slight delay for effect
            setTimeout(() => {
                const results = rawData.filter(item => 
                    item['หน้ากว้าง'] === width &&
                    item['Average of Denia'] === denia &&
                    item['Pattern'] === pattern &&
                    item['Frequency'] === freq &&
                    item['Color'] === color
                );

                renderResults(results, {width, denia, pattern, freq, color});
                
                document.getElementById('loading-results').classList.add('hidden');
                document.getElementById('result-area').classList.remove('hidden');
                
                window.scrollTo({
                    top: document.getElementById('result-area').offsetTop - 20,
                    behavior: 'smooth'
                });
            }, 600);
        }

        function renderResults(items, spec) {
            const container = document.getElementById('result-content');
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-[2rem] shadow-sm text-center border border-slate-100">
                        <i data-lucide="frown" class="w-10 h-10 text-slate-300 mx-auto mb-3"></i>
                        <p class="text-slate-500 font-bold">ไม่พบข้อมูลที่ตรงกับสเปกนี้ในระบบ</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            container.innerHTML = items.map(item => {
                const stock = parseFloat(item['Stock คงเหลือ'] || 0);
                const runningBal = parseFloat(item['Qty Back Ordered'] || 0);
                const machine = item['Weaving Machine No.'] || 'N/A';
                const status = stock > 0 ? 'In Stock' : (machine !== 'N/A' ? 'Running' : 'Offline');
                const statusColor = stock > 0 ? 'emerald' : (machine !== 'N/A' ? 'blue' : 'slate');

                return `
                    <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <span class="text-[9px] font-black text-blue-500 font-mono tracking-widest uppercase block mb-1">TARGET_ITEM: ${item['Item']}</span>
                                <h3 class="font-bold text-slate-800 text-lg uppercase tracking-tight">${item['Description']}</h3>
                            </div>
                            <span class="bg-${statusColor}-50 text-${statusColor}-600 text-[9px] px-3 py-1.5 rounded-full font-black uppercase border border-${statusColor}-100 tracking-tighter">${status}</span>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4 pt-5 border-t border-slate-50 mb-6">
                            <div>
                                <p class="text-[9px] text-slate-400 font-black uppercase mb-1 tracking-widest">Active Users</p>
                                <p class="text-xs font-bold text-slate-700 truncate">${item['ฝ่ายขาย'] || item['Customer Group'] || 'ไม่มีข้อมูล'}</p>
                            </div>
                            <div>
                                <p class="text-[9px] text-slate-400 font-black uppercase mb-1 tracking-widest">Machines</p>
                                <p class="text-xs font-bold text-slate-700">${machine === 'N/A' ? 'ไม่มีการทอ' : 'เครื่อง: ' + machine}</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-blue-600 p-5 rounded-[2rem] text-white shadow-xl shadow-blue-200">
                                <p class="text-[9px] font-black uppercase opacity-60 tracking-widest mb-1">Running Bal.</p>
                                <p class="text-2xl font-black italic">${runningBal.toLocaleString()}</p>
                                <p class="text-[9px] font-black uppercase mt-1">${item['Weaving Item'] || 'หลา'}</p>
                            </div>
                            <div class="bg-slate-900 p-5 rounded-[2rem] text-white shadow-xl shadow-slate-200">
                                <p class="text-[9px] font-black uppercase opacity-60 tracking-widest mb-1">Total Stock</p>
                                <p class="text-2xl font-black italic">${stock.toLocaleString()}</p>
                                <p class="text-[9px] font-black uppercase mt-1">${item['Weaving Item'] || 'หลา'}</p>
                            </div>
                        </div>
                        
                        <button onclick="copySummary('${item['Item']}', '${item['Description']}', '${stock}', '${machine}')" class="w-full mt-4 py-4 bg-white border border-slate-200 rounded-2xl text-[10px] font-black text-slate-500 uppercase tracking-widest flex items-center justify-center gap-2 hover:bg-slate-50 active:scale-95 transition-all">
                            <i data-lucide="clipboard" class="w-3 h-3"></i> Export Tactical Summary
                        </button>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function copySummary(id, desc, stock, machine) {
            const msg = `📊 [SACK MASTER REPORT]\n----------------\nID: ${id}\nDESC: ${desc}\nSTOCK: ${parseFloat(stock).toLocaleString()} หลา\nMACHINE: ${machine}\nTIME: ${new Date().toLocaleTimeString('th-TH')}`;
            const textArea = document.createElement("textarea");
            textArea.value = msg;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            alert('คัดลอกข้อมูลเรียบร้อย!');
        }

        window.onload = () => lucide.createIcons();
    </script>
</body>
</html>
